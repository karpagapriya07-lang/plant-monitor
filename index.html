<!DOCTYPE html>
<html>
<head>
    <title>🌱 Jasmine Smart Plant Monitoring</title>
    <script>
        async function loadData() {
            const response = await fetch("/get_data");
            const data = await response.json();

            document.getElementById("temp").innerText = data.temperature;
            document.getElementById("hum").innerText = data.humidity;
            document.getElementById("soil").innerText = data.soil_percentage;
            document.getElementById("light").innerText = data.light_value;
            document.getElementById("time").innerText = data.timestamp;
        }

        async function predictHealth() {
            const response = await fetch("/predict_health");
            const data = await response.json();
            document.getElementById("health").innerText = data.prediction;
        }

        async function uploadLeaf() {
            const fileInput = document.getElementById("leaf");
            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            const response = await fetch("/predict_leaf", {
                method: "POST",
                body: formData
            });

            const data = await response.json();
            document.getElementById("leaf_result").innerText = data.prediction;
        }

        setInterval(loadData, 3000);
    </script>
</head>
<body onload="loadData()">

<h1>🌱 Jasmine Smart Plant Monitoring System</h1>

<h2>📊 Live Sensor Data</h2>
Temperature: <span id="temp">0</span> °C <br>
Humidity: <span id="hum">0</span> % <br>
Soil Moisture: <span id="soil">0</span> % <br>
Light Value: <span id="light">0</span> <br>
Last Updated: <span id="time"></span> <br><br>

<button onclick="predictHealth()">Check Plant Health</button>
<p id="health"></p>

<h2>🍃 Leaf Disease Detection</h2>
<input type="file" id="leaf">
<button onclick="uploadLeaf()">Upload & Predict</button>
<p id="leaf_result"></p>

</body>
</html>
